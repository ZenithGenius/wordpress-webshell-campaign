<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    @font-face {
      font-family: "Hanken Grotesk";
      src: url("{{ '/assets/fonts/hanken-grotesk-var.woff2' | relative_url }}") format("woff2");
      font-weight: 400 700; font-style: normal; font-display: swap;
    }

    /* Cool dark glass + neon. Committed dark: glass/neon only reads on dark. */
    :root {
      --bg-0:    oklch(0.165 0.028 264);
      --bg-1:    oklch(0.205 0.032 264);
      --ink:     oklch(0.962 0.012 250);
      --muted:   oklch(0.740 0.024 255);
      --faint:   oklch(0.600 0.024 258);

      --glass:        color-mix(in oklab, oklch(0.34 0.045 262) 20%, transparent);
      --glass-strong: color-mix(in oklab, oklch(0.40 0.055 262) 34%, transparent);
      --hair:   color-mix(in oklab, white 11%, transparent);
      --hair-2: color-mix(in oklab, white 20%, transparent);

      --neon:    oklch(0.865 0.150 205);   /* cyan */
      --neon-2:  oklch(0.740 0.170 300);   /* violet, background only */
      --neon-dim: color-mix(in oklab, var(--neon) 46%, transparent);
      --glow:    0 0 10px color-mix(in oklab, var(--neon) 55%, transparent);
      --glow-sm: 0 0 6px color-mix(in oklab, var(--neon) 40%, transparent);

      --sans: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
      --shell: 82rem;
      --read: 44rem;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      margin: 0; color: var(--ink);
      font-family: var(--sans); font-size: 1.0625rem; line-height: 1.72;
      font-weight: 400; letter-spacing: -0.003em;
      background: var(--bg-0);
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    /* Fixed aurora the glass panels frost against. */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(42rem 38rem at 10% -10%, color-mix(in oklab, var(--neon) 20%, transparent), transparent 62%),
        radial-gradient(46rem 42rem at 96% 4%, color-mix(in oklab, var(--neon-2) 20%, transparent), transparent 60%),
        radial-gradient(52rem 44rem at 62% 112%, color-mix(in oklab, var(--neon) 12%, transparent), transparent 60%),
        var(--bg-0);
    }

    main { animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } }

    /* ---- masthead (glass) ---- */
    .masthead {
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in oklab, var(--bg-0) 52%, transparent);
      backdrop-filter: blur(16px) saturate(135%);
      -webkit-backdrop-filter: blur(16px) saturate(135%);
      border-bottom: 1px solid var(--hair);
    }
    .masthead-in {
      max-width: var(--shell); margin: 0 auto;
      padding: 1.05rem 2rem; display: flex; align-items: baseline;
      justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .brand {
      font-family: var(--mono); font-weight: 600; font-size: 0.95rem;
      letter-spacing: -0.01em; color: var(--ink);
    }
    .brand span { color: var(--neon); font-weight: 500; text-shadow: var(--glow-sm); }
    .masthead-in nav { display: flex; gap: 1.4rem; font-size: 0.82rem;
      font-family: var(--mono); text-transform: lowercase; }
    .masthead-in nav a { color: var(--muted); text-decoration: none; }
    .masthead-in nav a:hover { color: var(--neon); text-shadow: var(--glow-sm); }

    /* ---- two-column shell ---- */
    .shell {
      max-width: var(--shell); margin: 0 auto;
      padding: 3.25rem 2rem 5rem;
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 3.5rem;
    }
    @media (min-width: 1080px) {
      .shell { grid-template-columns: 15rem minmax(0, 1fr); }
      /* No TOC (e.g. homepage): collapse to a single column, no empty rail. */
      .shell:has(.toc:empty) { grid-template-columns: minmax(0, 1fr); }
    }

    /* ---- table of contents (glass rail) ---- */
    .toc { display: none; }
    @media (min-width: 1080px) {
      .toc:not(:empty) {
        display: block; position: sticky; top: 5.4rem; align-self: start;
        font-size: 0.88rem; line-height: 1.5; max-height: calc(100vh - 7rem); overflow-y: auto;
        padding: 1.1rem 1rem; border-radius: 14px;
        background: var(--glass);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        border: 1px solid var(--hair);
      }
    }
    .toc-label {
      font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.14em;
      font-size: 0.66rem; font-weight: 600; color: var(--faint); margin-bottom: 0.85rem;
    }
    .toc ol { list-style: none; margin: 0; padding: 0; }
    .toc li { margin: 0.1rem 0; }
    .toc a {
      display: block; padding: 0.28rem 0 0.28rem 0.85rem; color: var(--muted);
      text-decoration: none; border-left: 1px solid var(--hair-2);
    }
    .toc a:hover { color: var(--ink); border-left-color: var(--neon-dim); }
    .toc a.active {
      color: var(--neon); border-left-color: var(--neon);
      box-shadow: -1px 0 6px -1px color-mix(in oklab, var(--neon) 55%, transparent);
      font-weight: 500;
    }

    /* ---- article ---- */
    article { min-width: 0; }
    article > * { max-width: var(--read); }
    article > pre, article > table, article > .mermaid,
    article > p:has(> img), article > blockquote { max-width: 100%; }

    a { color: var(--neon); text-decoration: underline;
        text-decoration-thickness: 1px; text-underline-offset: 0.16em;
        text-decoration-color: var(--neon-dim); }
    a:hover { color: var(--ink); text-decoration-color: var(--neon); text-shadow: var(--glow-sm); }

    h1, h2, h3, h4 { line-height: 1.16; letter-spacing: -0.02em; font-weight: 700; color: var(--ink); }
    h1 { font-size: clamp(2rem, 1.4rem + 2.4vw, 3rem); margin: 0.1rem 0 0.7rem; }
    h2 { font-size: clamp(1.45rem, 1.28rem + 0.8vw, 1.8rem); font-weight: 650;
         margin: 3.1rem 0 1rem; padding-top: 1.5rem; border-top: 1px solid var(--hair);
         scroll-margin-top: 5.5rem; }
    /* neon tick before each section heading */
    h2::before {
      content: ""; display: inline-block; width: 0.62rem; height: 0.62rem;
      margin-right: 0.6rem; border-radius: 2px; vertical-align: 0.06em;
      background: var(--neon); box-shadow: var(--glow-sm);
    }
    h3 { font-size: 1.22rem; font-weight: 600; margin: 2.1rem 0 0.6rem; scroll-margin-top: 5.5rem; }
    h4 { font-size: 1.02rem; font-weight: 600; margin: 1.6rem 0 0.4rem; color: var(--muted); }
    p, ul, ol { margin: 0 0 1.15rem; }
    li { margin: 0.3rem 0; }
    li::marker { color: var(--neon-dim); }
    strong { font-weight: 600; color: color-mix(in oklab, var(--ink) 88%, var(--neon)); }

    h1 + p { font-size: 1.2rem; line-height: 1.58; color: var(--muted); font-weight: 400;
             margin-bottom: 1.6rem; }
    p > em:only-child {
      display: block; font-style: normal; font-family: var(--mono); font-size: 0.78rem;
      letter-spacing: 0.01em; color: var(--faint); line-height: 1.5; margin-top: -0.6rem;
    }

    code {
      font-family: var(--mono); font-size: 0.84em;
      background: color-mix(in oklab, var(--neon) 12%, transparent);
      color: color-mix(in oklab, var(--ink) 78%, var(--neon));
      padding: 0.1em 0.4em; border-radius: 5px;
      border: 1px solid color-mix(in oklab, var(--neon) 22%, transparent);
    }
    pre {
      background: var(--glass);
      backdrop-filter: blur(12px) saturate(120%);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
      color: var(--ink);
      padding: 1.05rem 1.2rem; border-radius: 12px; border: 1px solid var(--hair);
      overflow-x: auto; font-size: 0.84rem; line-height: 1.62; margin: 1.3rem 0;
    }
    pre code { background: none; border: none; padding: 0; font-size: inherit; color: inherit; }

    blockquote {
      margin: 1.5rem 0; padding: 1rem 1.25rem; border-radius: 12px;
      background: var(--glass); color: var(--muted);
      backdrop-filter: blur(12px) saturate(120%);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
      font-size: 0.97rem; border: 1px solid var(--hair);
      border-left: 2px solid var(--neon-dim);
    }
    blockquote p:last-child { margin-bottom: 0; }

    img { max-width: 100%; height: auto; display: block;
          border: 1px solid var(--hair-2); border-radius: 12px; margin: 1.5rem 0 0.5rem; }

    /* glass card around tables */
    table { width: 100%; border-collapse: collapse; margin: 1.5rem 0;
            font-size: 0.94rem; display: block; overflow-x: auto;
            background: var(--glass);
            backdrop-filter: blur(12px) saturate(120%);
            -webkit-backdrop-filter: blur(12px) saturate(120%);
            border: 1px solid var(--hair); border-radius: 12px; padding: 0.3rem 1rem; }
    th, td { text-align: left; padding: 0.62rem 0.9rem 0.62rem 0;
             border-bottom: 1px solid var(--hair); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    th { font-weight: 600; color: var(--neon); font-family: var(--mono); font-size: 0.8rem;
         text-transform: uppercase; letter-spacing: 0.04em;
         border-bottom: 1px solid var(--hair-2); white-space: nowrap; }
    td:not(:last-child), th:not(:last-child) { padding-right: 1.7rem; }

    hr { border: 0; border-top: 1px solid var(--hair); margin: 2.8rem 0; max-width: 100%; }

    .mermaid {
      margin: 1.9rem 0; text-align: center;
      background: var(--glass);
      backdrop-filter: blur(12px) saturate(120%);
      -webkit-backdrop-filter: blur(12px) saturate(120%);
      border: 1px solid var(--hair); border-radius: 14px; padding: 1.4rem 1rem;
    }
    .mermaid svg { max-width: 100%; height: auto; }

    .site-foot {
      max-width: var(--shell); margin: 0 auto; padding: 2rem 2rem 4rem;
      border-top: 1px solid var(--hair); color: var(--faint); font-size: 0.85rem;
      font-family: var(--mono);
    }
    .site-foot a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-in">
      <a class="brand" href="{{ '/' | relative_url }}">Isaac Joumessi <span>/ security research</span></a>
      <nav>
        <a href="{{ '/analysis/01-ir-war-story.html' | relative_url }}">War story</a>
        <a href="{{ '/analysis/02-actor-campaign.html' | relative_url }}">Campaign</a>
        <a href="{{ '/analysis/03-deobfuscation.html' | relative_url }}">Reversing</a>
        <a href="{{ '/analysis/04-tracing.html' | relative_url }}">Tracing</a>
        <a href="{{ '/analysis/IOCs.html' | relative_url }}">Indicators</a>
        <a href="https://github.com/ZenithGenius/wordpress-webshell-campaign">Repository</a>
      </nav>
    </div>
  </header>

  <div class="shell">
    <aside class="toc" id="toc" aria-label="On this page"></aside>
    <article>
      {{ content }}
    </article>
  </div>

  <footer class="site-foot">
    Isaac Joumessi. Written up for defensive and educational use.
    Attacker indicators are shared for threat intelligence; the affected parties are not identified.
  </footer>

  <script src="{{ '/assets/mermaid.min.js' | relative_url }}"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Mermaid: convert fenced blocks to diagrams, themed to the neon-glass palette.
      document.querySelectorAll("code.language-mermaid, .language-mermaid").forEach(function (el) {
        var host = el.closest(".language-mermaid") || el;
        var div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = el.textContent;
        host.replaceWith(div);
      });
      var theme = { primaryColor: "#1c2436", primaryBorderColor: "#4fd4ea", primaryTextColor: "#e9f1ff",
                    lineColor: "#5bd0e6", secondaryColor: "#241f3a", tertiaryColor: "#161a26",
                    fontSize: "15px" };
      theme.fontFamily = '"Hanken Grotesk", ui-sans-serif, system-ui, sans-serif';
      mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "base",
                           themeVariables: theme, flowchart: { curve: "basis", padding: 14 } });
      mermaid.run({ querySelector: ".mermaid" });

      // Build the table of contents from section headings.
      var heads = Array.prototype.slice.call(document.querySelectorAll("article h2[id]"));
      var toc = document.getElementById("toc");
      if (toc && heads.length > 2) {
        var label = document.createElement("div");
        label.className = "toc-label"; label.textContent = "On this page";
        var ol = document.createElement("ol");
        heads.forEach(function (h) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = "#" + h.id;
          a.textContent = h.textContent.replace(/^\s*\d+[.)]\s*/, "");
          li.appendChild(a); ol.appendChild(li);
        });
        toc.appendChild(label); toc.appendChild(ol);

        // Lightweight scroll-spy.
        var links = {};
        ol.querySelectorAll("a").forEach(function (a) { links[a.getAttribute("href").slice(1)] = a; });
        var spy = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) {
              Object.values(links).forEach(function (a) { a.classList.remove("active"); });
              if (links[e.target.id]) links[e.target.id].classList.add("active");
            }
          });
        }, { rootMargin: "-10% 0px -80% 0px" });
        heads.forEach(function (h) { spy.observe(h); });
      }
    });
  </script>
</body>
</html>
